<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ШШШШШ!</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #c8a97e; /* Light brown */
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            text-align: center;
        }

        img {
            max-width: 300px;
            width: 100%;
            border-radius: 16px;
            margin-bottom: 24px;
        }

        .btn-link {
            display: inline-block;
            padding: 12px 24px;
            background: linear-gradient(135deg, #4f8cff, #2563eb);
            color: white;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
            transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
            user-select: none;
        }

        .btn-link:hover {
            filter: brightness(1.08);
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(37, 99, 235, 0.45);
        }

        .btn-link:active {
            transform: translateY(1px);
            box-shadow: 0 2px 6px rgba(37, 99, 235, 0.3);
        }

        .btn-link:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }
    </style>
</head>

<body>

    <img src="https://files.catbox.moe/wrk90o.jpg" alt="Venniy">

    <h1>ШШШШШ!</h1>

    <h3>Я — Венний, дмитляндовский удав, которого ты должен бояться!</h3>

    <h2>СЪЕМ!</h2>

    <a href="https://example.com" class="btn-link">Click Me</a>

  <a href="https://google.com" class="btn-link">Google</a>

</body>
</html>
